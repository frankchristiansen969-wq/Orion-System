  const month = Math.floor((d % 360) / 30) + 1;

  const initial=JSON.parse(document.getElementById('seed').textContent);let data;try{data=JSON.parse(localStorage.getItem('orion-v1'))||initial}catch{data=initial}let active='Character',chosen=null,skillFilter='Alle';const tabs=['Character','Skills','Professions','Inventory','Journal','Quests','Map','Calendar'];const icons=['♙','✧','⚒','▣','☷','⚑','◈','▦'];const esc=s=>String(s??'Ikke fastlagt').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const value=x=>x===null||x===undefined?'Ikke fastlagt':esc(x);function save(){localStorage.setItem('orion-v1',JSON.stringify(data))}function item(title,body,tag=''){return `<div class="item"><div class="row"><strong>${esc(title)}</strong>${tag?`<span class="chip">${esc(tag)}</span>`:''}</div><div class="muted">${esc(body||'')}</div></div>`}function cards(rows){return `<div class="grid">${rows.map(r=>`<section class="card"><h3>${esc(r[0])}</h3>${r[1]}</section>`).join('')}</div>`}function render(){document.getElementById('worldline').textContent=`${data.world.kingdom} · ${fantasyDate(data.world.day)} · ${data.world.location}`;document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${t}" class="${active===t?'active':''}">${icons[i]} ${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});const d=document.getElementById('content');if(active==='Character'){let c=data.character;d.innerHTML=`<h2>Orion · Karakter</h2>`+cards([['Identitet',item('Navn',c.name)+item('Race',c.species)+item('Sted',data.world.location)],['Progression',item('Karakterlevel',value(c.level))+item('Karakter-XP',value(c.xp))+item('Klasse',value(c.class))+item('Klasselevel',value(c.classLevel))],['Ressourcer',item('Liv',value(c.health))+item('Mana',value(c.mana))+`<p class="muted">${esc(c.notes)}</p>`],['Økonomi',item('Guld',value(data.currency.gold))+item('Sølv',value(data.currency.silver))+item('Kobber',value(data.currency.copper))+`<p document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`orion_data_day_${data.world.day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const incoming=JSON.parse(await f.text());if(!incoming.world||!incoming.character||!incoming.map||!Array.isArray(incoming.skills))throw Error('Manglende datafelter');if(!confirm('Importér JSON og erstat den aktuelle lokale status? Eksportér først en backup, hvis du vil bevare den.'))return;data=incoming;save();render();alert('Data importeret.')}catch(err){alert('Import mislykkedes: '+err.message)}e.target.value=''};render();
